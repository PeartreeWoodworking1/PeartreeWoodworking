<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/resources/css/style.css">
        <title>Peartree Woodworking</title>
    </head>
    <body>
        <header>
            <div class="header-left">
                <a href="/" class="logo">
                    <img src="/resources/images/logo_transparent.png" alt="Peartree">
                </a>
                <nav aria-label="Main navigation">
                    <ul>
                        <li><a href="/">Home</a></li>
                        <li><a href="/about">About</a></li>
                        <li><a href="/products" aria-current="page">Products</a></li>
                        <li><a href="/contact">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main>
            <section class="products">
                <h1>Our Work</h1>

                <p class="products-intro">
                <!-- SHORT INTRO -->
                Each piece is handcrafted using premium hardwoods and traditional joinery.
                </p>

                <div class="product-grid">
                <!-- PRODUCT ITEM -->
                <article class="product-card">
                    <img src="PATH-TO-IMAGE.jpg" alt="PRODUCT NAME">
                    <h2>Product Name</h2>
                    <p>
                    Short description including wood type, finish, or use.
                    </p>
                </article>

                <!-- Repeat as needed -->
                </div>
            </section>
        </main>

        <footer>
            <div class="footer-inner">
                <a href="/" class="footer-logo">
                    <img src="/resources/images/logo_transparent.png">
                </a>
                <nav aria-label="Footer navigation">
                    <ul>
                        <li><a href="/about">About</a></li>
                        <li><a href="/products">Products</a></li>
                        <li><a href="/contact">Contact</a></li>
                    </ul>
                </nav>
            </div>
            <div class="footer-bottom">
                <p>©Peartree Woodworking. All rights reserved.</p>
            </div>
        </footer>
